name: Update Terminal Profile

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate terminal profile
        env:
          GH_USERNAME: Vineeth1512
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node generate-profile.mjs

      - name: Commit generated profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dist/profile.svg

          git diff --cached --quiet || \
            git commit -m "chore: update terminal profile"

          git push
